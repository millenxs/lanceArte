services:
  postgres:
    image: postgres:17-alpine
    container_name: lancearte-postgres
    environment:
      POSTGRES_USER: lancearte
      POSTGRES_PASSWORD: lancearte
      POSTGRES_DB: lancearte
    ports:
      - "5432:5432"
    volumes:
      - lancearte_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lancearte -d lancearte"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://lancearte:lancearte@postgres:5432/lancearte
      SESSION_SECRET: local-compose-secret-change-me
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      AIC_USER_AGENT: LanceArte/1.0 (local development)
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm --prefix apps/api run db:setup && npm --prefix apps/api run db:seed && npm --prefix apps/api start"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
        API_PROXY_TARGET: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  lancearte_data:
